<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      max-height: 520px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #0f172a;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* --- Minimal Top Bar --- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 14px;
    }
    .header-title {
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-subtitle {
      font-size: 11px;
      color: #64748b;
    }

    /* --- Minimal Button --- */
    #scanBtn {
      width: 100%;
      padding: 9px 14px;
      background: #0f172a;
      color: #ffffff;
      border: 1px solid #0f172a;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    #scanBtn:hover:not(:disabled) {
      background: #1e293b;
      border-color: #1e293b;
    }
    #scanBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #results { margin-top: 14px; }
    .status {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 12px;
    }

    /* --- Clean Inline Verdict Banner --- */
    .verdict-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }
    .verdict-banner.critical { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
    .verdict-banner.high { background: #fff7ed; border-color: #fed7aa; color: #c2410c; }
    .verdict-banner.moderate { background: #fefce8; border-color: #fef08a; color: #854d0e; }
    .verdict-banner.low { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
    .verdict-banner.safe { background: #f8fafc; border-color: #e2e8f0; color: #475569; }

    /* --- Minimal List --- */
    .threats-header {
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .threat-row {
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .threat-row:last-child { border-bottom: none; }

    .threat-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
    }
    .threat-badge {
      font-size: 9px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .threat-badge.critical { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .threat-badge.high { background: #fff7ed; color: #ea580c; border: 1px solid #fed7aa; }
    .threat-badge.medium { background: #fefce8; color: #ca8a04; border: 1px solid #fef08a; }

    .threat-name {
      font-size: 12px;
      font-weight: 600;
      color: #0f172a;
    }
    .threat-desc {
      font-size: 11px;
      color: #475569;
      line-height: 1.4;
      margin-bottom: 4px;
    }
    .threat-quote {
      font-size: 10.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #64748b;
      background: #f8fafc;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
      line-height: 1.35;
      word-break: break-word;
    }

    /* --- Minimal Tips --- */
    .tips-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
    }
    .tips-title {
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .tip-line {
      font-size: 11px;
      color: #475569;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    /* --- Footer Disclaimer --- */
    .disclaimer {
      margin-top: 16px;
      font-size: 10px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.35;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">Privacy Auditor</div>
    <div class="header-subtitle">Local Analysis</div>
  </div>

  <button id="scanBtn">Scan Policy</button>

  <div id="results">
    <div id="status" class="status"></div>
    <div id="verdictBox"></div>
    <div id="riskList"></div>
    <div id="tipsBox"></div>
    <div id="disclaimer"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
