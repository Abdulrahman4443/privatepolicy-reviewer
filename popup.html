<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      max-height: 520px;
      overflow-y: auto;
      font: 13px/1.5 "Segoe UI", -apple-system, system-ui, sans-serif;
      color: #eef2f7;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      padding: 0;
    }

    /* Glass header */
    .toolbar {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toolbar-title { font-weight: 600; font-size: 14px; color: #fff; }
    .toolbar-tag { font-size: 10px; color: rgba(255,255,255,0.5); }

    .body-wrap { padding: 12px 14px; }

    /* Scan button - glass */
    #scanBtn {
      width: 100%;
      padding: 9px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      font: 600 13px/1 inherit;
      cursor: pointer;
      transition: background .15s;
    }
    #scanBtn:hover:not(:disabled) { background: rgba(255,255,255,0.2); }
    #scanBtn:disabled { opacity: .5; cursor: default; }

    /* Status */
    #status { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 8px; min-height: 16px; }

    /* Verdict - glass strip */
    .verdict-strip {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .verdict-strip.critical { background: rgba(220,38,38,0.2); color: #fca5a5; }
    .verdict-strip.high { background: rgba(234,88,12,0.2); color: #fdba74; }
    .verdict-strip.moderate { background: rgba(202,138,4,0.2); color: #fde047; }
    .verdict-strip.low { background: rgba(22,163,74,0.2); color: #86efac; }
    .verdict-strip.safe { background: rgba(22,163,74,0.15); color: #86efac; }
    .verdict-sub { font-weight: 400; font-size: 11px; opacity: .8; }

    /* Section head */
    .sec-head {
      margin-top: 14px;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: .4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sec-count {
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 10px;
      padding: 0 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    /* Finding cards - glass */
    .finding {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      border-left: 3px solid rgba(255,255,255,0.15);
    }
    .finding.f-critical { border-left-color: #ef4444; }
    .finding.f-high { border-left-color: #f97316; }
    .finding.f-medium { border-left-color: #eab308; }

    .f-top { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    .f-sev {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      line-height: 1.4;
    }
    .f-sev.s-critical { background: rgba(239,68,68,0.2); color: #fca5a5; }
    .f-sev.s-high { background: rgba(249,115,22,0.2); color: #fdba74; }
    .f-sev.s-medium { background: rgba(234,179,8,0.2); color: #fde047; }

    .f-name { font-weight: 600; font-size: 12px; color: #f0f4f8; }
    .f-impact { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 1px; }
    .f-quote {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      font-style: italic;
      margin-top: 3px;
      padding: 3px 6px;
      background: rgba(0,0,0,0.15);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 4px;
      word-break: break-word;
    }

    .safe-msg { color: #86efac; font-size: 12px; padding: 8px 0; }

    /* Tips - glass */
    .tips-wrap {
      margin-top: 12px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .tip-row { font-size: 11px; color: rgba(255,255,255,0.55); margin-bottom: 3px; padding-left: 10px; text-indent: -10px; }

    /* Footer */
    .foot { font-size: 9px; color: rgba(255,255,255,0.25); text-align: center; margin-top: 14px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.06); }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="toolbar-title">Privacy Auditor</span>
    <span class="toolbar-tag">Local Scan</span>
  </div>
  <div class="body-wrap">
    <button id="scanBtn">Scan This Page</button>
    <div id="status"></div>
    <div id="verdictBox"></div>
    <div id="riskList"></div>
    <div id="tipsBox"></div>
    <div id="disclaimer"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
