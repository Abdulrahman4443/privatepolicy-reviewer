<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      max-height: 500px;
      overflow-y: auto;
      font: 12px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif;
      color: #222;
      background: #fff;
      padding: 12px;
    }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .top b { font-size: 13px; }
    .top small { color: #888; font-size: 10px; }
    #scanBtn {
      width: 100%;
      padding: 7px;
      background: #222;
      color: #fff;
      border: none;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }
    #scanBtn:hover:not(:disabled) { background: #444; }
    #scanBtn:disabled { opacity: .5; cursor: default; }
    #status { color: #888; font-size: 11px; margin-top: 10px; }
    #verdictBox { margin-top: 8px; }
    .v { font-size: 11px; padding: 6px 8px; border: 1px solid #ddd; }
    .v.critical { border-color: #c00; color: #900; }
    .v.high { border-color: #e60; color: #b40; }
    .v.moderate { border-color: #a80; color: #860; }
    .v.low { border-color: #080; color: #060; }
    .v.safe { border-color: #ddd; color: #666; }
    .section-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: .5px; margin: 12px 0 4px; }
    .item { padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 11px; }
    .item:last-child { border-bottom: none; }
    .sev { font-size: 9px; font-weight: 700; margin-right: 4px; }
    .sev.c { color: #c00; }
    .sev.h { color: #e60; }
    .sev.m { color: #a80; }
    .item-title { font-weight: 600; }
    .item-desc { color: #555; }
    .item-quote { font-size: 10px; color: #888; font-family: monospace; margin-top: 2px; word-break: break-word; }
    .tip { font-size: 11px; color: #555; margin: 2px 0; }
    .foot { font-size: 9px; color: #bbb; text-align: center; margin-top: 12px; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: #ccc; }
  </style>
</head>
<body>
  <div class="top"><b>Privacy Auditor</b><small>v1.0</small></div>
  <button id="scanBtn">Scan</button>
  <div id="status"></div>
  <div id="verdictBox"></div>
  <div id="riskList"></div>
  <div id="tipsBox"></div>
  <div id="disclaimer"></div>
  <script src="popup.js"></script>
</body>
</html>
